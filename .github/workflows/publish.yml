name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build client bundles
        run: |
          node packages/dsh-tavily/scripts/build-client.mjs

      # Publish dependencies first: the combined package depends on these two.
      # Each step is idempotent: if the exact version is already on npm it is
      # skipped, so a partial/retried run (or re-running an existing tag) does
      # not fail on an already-published version.
      - name: Publish @moguiyu/dsh-tool-tavily-search
        run: |
          PKG=@moguiyu/dsh-tool-tavily-search
          DIR=./packages/dsh-tool-tavily-search
          VER=$(node -p "require('$DIR/package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already published; skipping"
          else
            npm publish $DIR --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @moguiyu/dsh-tavily-backend
        run: |
          PKG=@moguiyu/dsh-tavily-backend
          DIR=./packages/dsh-tavily-backend
          VER=$(node -p "require('$DIR/package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already published; skipping"
          else
            npm publish $DIR --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @moguiyu/dsh-tavily
        run: |
          PKG=@moguiyu/dsh-tavily
          DIR=./packages/dsh-tavily
          VER=$(node -p "require('$DIR/package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already published; skipping"
          else
            npm publish $DIR --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
