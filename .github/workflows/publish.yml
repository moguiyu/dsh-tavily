name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Verify release version
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/dsh-tavily/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Build client bundles
        run: node packages/dsh-tavily/scripts/build-client.mjs

      - name: Publish @moguiyu/dsh-tavily
        run: npm publish ./packages/dsh-tavily --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
