# Workspace packages plus pnpm link settings: sibling @moguiyu/* packages are
# linked from this workspace instead of resolved from the npm registry
# (preferWorkspacePackages keeps the workspace copy winning even after a
# registry release).
packages:
  - packages/*
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.8'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-code-runtime@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-home-paths@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-scope@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-session@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-settings@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-tools@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/dsh-user-approval@0.1.0-rc.8 || 0.1.2-alpha.2'
  - '@deepseek-ai/cordis@4.0.2'
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/dsh-session-projection@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.2'
  - '@deepseek-ai/schemastery@3.18.2'
preferWorkspacePackages: true
